services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports: ["1433:1433"]
    volumes:
      - mssql-data:/var/opt/mssql
      - ./Scripts:/scripts:ro
    healthcheck:
      test: ["CMD","/opt/mssql-tools18/bin/sqlcmd","-S","localhost","-U","sa","-P","${SA_PASSWORD}","-C","-Q","SELECT 1"]
      interval: 10s
      retries: 10
      start_period: 25s

  api:
    build: { context: ., dockerfile: HotelApp.API/Dockerfile }
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=HotelAppDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Jwt__SecretKey: "${JWT_SECRET}"
      AuthSettings__UseEmailVerification: "true"
      EmailSettings__Username: "${MAILTRAP_USER}"
      EmailSettings__Password: "${MAILTRAP_PASS}"
      EmailSettings__VerifyEmailBaseUrl: "http://localhost:8081/Auth/VerifyEmail"
      EmailSettings__ResetPasswordBaseUrl: "http://localhost:8081/Auth/ResetPassword"
    depends_on:
      sqlserver: { condition: service_healthy }
    ports: ["8080:8080"]

  web:
    build: { context: ., dockerfile: HotelApp.Web/Dockerfile }
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ApiSettings__BaseUrl: "http://api:8080/api/"
      Jwt__SecretKey: "${JWT_SECRET}"
    depends_on: [api]
    ports: ["8081:8080"]

volumes:
  mssql-data: