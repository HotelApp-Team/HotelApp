<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Varsayılan şehir görseli</title>
  <desc id="desc">Bilinmeyen şehirler için kullanılan sade otel ve şehir silüeti.</desc>
  <defs>
